name: Block PRs to Main

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  close-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Close PR targeting main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "Pull requests to main are disabled. Please target one of the other two branches instead."
          gh pr close ${{ github.event.pull_request.number }}
